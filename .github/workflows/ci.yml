name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # 版上げ直後は optionalDependencies（@tailii/quic-gw-darwin-*）が未 publish で
      # lock にも registry にも無い。--omit=optional は TypeScript 自身の
      # プラットフォームパッケージまで外すので、@tailii のピンだけ外して入れる。
      - name: Install dependencies
        run: |
          npm pkg delete optionalDependencies
          npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm test
