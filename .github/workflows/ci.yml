name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # リリース直後の版上げコミットでは optionalDependencies が未 publish のため
      # lock に載らない。CI は prebuilt を必要としないので optional は外す。
      - run: npm ci --omit=optional
      - run: npm run lint
      - run: npm run build
      - run: npm test
