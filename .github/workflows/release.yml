name: Release

# タグ push（例: v0.1.2）で tailii-host と QUIC ゲートウェイ prebuilt を npm 公開する。
# 手動実行（workflow_dispatch）でも起動できる。
#
# 公開順は platform package（@tailii/quic-gw-darwin-*）→ tailii-host（optionalDependencies が
# 参照するため、先に platform package が registry に存在している必要がある）。
#
# 認証は npm Trusted Publishing（OIDC）。トークンは使わない。
# 前提: npmjs.com の各パッケージ（tailii-host / @tailii/quic-gw-darwin-arm64 /
# @tailii/quic-gw-darwin-x64）の Settings → Trusted Publisher に、この
# リポジトリと **このファイル名（release.yml）** を登録しておくこと。
# 要件: `id-token: write`・Node 22.14 以上・npm 11.5.1 以上（npm docs: trusted-publishers）。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  # OIDC トークンの発行に必須（これが無いと trusted publishing は成立しない）。
  id-token: write

jobs:
  release:
    # macos-latest（arm64）1台で aarch64 と x86_64 を両方クロスビルドする。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm

      # trusted publishing は npm 11.5.1 以上が要る（Node 同梱版が古い場合の保険）。
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install Rust targets
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build gateway (both arches)
        working-directory: quic-gw
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Stage prebuilt binaries into platform packages
        run: node scripts/stage-prebuilt.mjs

      # 版上げコミットの時点では optionalDependencies（@tailii/quic-gw-darwin-*）が
      # 未 publish で lock に載せられず、`npm ci` は lock 不一致（EUSAGE）で必ず落ちる
      # （--omit=optional を付けても lock 検証は走る）。ゲートウェイはジョブ内で
      # ソースからビルドするので、optional を外した npm install で入れる。
      - run: npm install --omit=optional --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm test

      # platform package を先に公開（tailii-host の optionalDependencies が参照するため）。
      - name: Publish @tailii/quic-gw-darwin-arm64
        working-directory: quic-gw/npm/darwin-arm64
        run: npm publish --access public

      - name: Publish @tailii/quic-gw-darwin-x64
        working-directory: quic-gw/npm/darwin-x64
        run: npm publish --access public

      - name: Publish tailii-host
        run: npm publish --access public
